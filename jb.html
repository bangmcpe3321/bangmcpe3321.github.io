<!doctype html>
<html lang="en" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>HEXA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
      *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }

      html, body {
        min-height:100vh;
        background:#090c14;
        color:#c4d1e0;
        font:15px/1.5 'Inter', system-ui, sans-serif;
      }

      /* Animated gradient background */
      body::before {
        content:'';
        position:fixed;
        inset:0;
        background:
          radial-gradient(ellipse 60% 50% at 20% 80%, rgba(0,180,200,0.08) 0%, transparent 70%),
          radial-gradient(ellipse 50% 60% at 80% 20%, rgba(56,100,220,0.06) 0%, transparent 70%),
          radial-gradient(ellipse 80% 80% at 50% 50%, rgba(10,30,60,0.4) 0%, transparent 100%);
        pointer-events:none;
        z-index:0;
      }

      /* Brand bar */
      #brand {
        position:relative;
        z-index:10;
        display:flex;
        align-items:center;
        justify-content:center;
        gap:12px;
        padding:14px 20px;
        background:rgba(12,18,30,0.85);
        backdrop-filter:blur(16px);
        -webkit-backdrop-filter:blur(16px);
        border-bottom:1px solid rgba(56,180,220,0.12);
      }

      #brand .logo-icon {
        width:34px; height:34px;
        border-radius:10px;
        box-shadow:0 0 18px rgba(14,165,192,0.25);
        flex-shrink:0;
      }

      #brand b {
        font-size:17px;
        font-weight:700;
        letter-spacing:0.22em;
        background:linear-gradient(135deg, #5de0f5 0%, #a0c4ff 50%, #5de0f5 100%);
        background-size:200% 100%;
        -webkit-background-clip:text;
        -webkit-text-fill-color:transparent;
        background-clip:text;
        animation:shimmer 4s ease-in-out infinite;
      }

      @keyframes shimmer {
        0%,100% { background-position:0% 50%; }
        50% { background-position:100% 50%; }
      }

      /* Spinner */
      #spin {
        position:fixed;
        top:calc(50% + 28px);
        left:50%;
        width:48px;
        height:48px;
        margin:-24px 0 0 -24px;
        border:3px solid rgba(14,165,192,0.15);
        border-top-color:#0ea5c0;
        border-radius:50%;
        animation:spin 0.85s linear infinite;
        z-index:10;
        box-shadow:0 0 24px rgba(14,165,192,0.1);
      }
      @keyframes spin {
        to { transform:rotate(360deg); }
      }

      /* Center message */
      #msg {
        position:fixed;
        top:50%;
        left:0; right:0;
        transform:translateY(-50%);
        text-align:center;
        font-size:16px;
        font-weight:600;
        letter-spacing:0.04em;
        color:#f06868;
        display:none;
        z-index:10;
      }

      #wrap {
        position:relative;
        z-index:10;
        padding:0;
      }
      #state, #out { display:none; }

      body.done #spin { display:none; }
      body.fail #spin { display:none; }
      body.fail #msg  { display:block; }

      /* ?log=1 — full step log */
      body.log #spin,
      body.log #msg { display:none; }

      body.log #wrap {
        padding:20px 24px;
      }

      body.log #state {
        display:block;
        font-size:22px;
        font-weight:700;
        margin:0 0 12px;
        letter-spacing:0.01em;
      }

      body.log #out {
        display:block;
        white-space:pre-wrap;
        font:13px/1.55 'JetBrains Mono', Consolas, monospace;
        background:rgba(12,18,30,0.7);
        backdrop-filter:blur(8px);
        border:1px solid rgba(56,180,220,0.1);
        border-radius:8px;
        padding:14px 16px;
        height:calc(100vh - 148px);
        overflow-y:auto;
        color:#a0b8d4;
      }

      /* Scrollbar */
      body.log #out::-webkit-scrollbar { width:6px; }
      body.log #out::-webkit-scrollbar-track { background:transparent; }
      body.log #out::-webkit-scrollbar-thumb {
        background:rgba(14,165,192,0.2);
        border-radius:3px;
      }

      .ok   { color:#4fd1b0; }
      .bad  { color:#f06868; }
      .warn { color:#f0b040; }
      .safe { color:#4fd1b0; }
      .danger { color:#f06868; }
      code  { color:#7ab8e8; }

      /* Footer hint */
      .footer-hint {
        position:fixed;
        bottom:20px;
        left:0;right:0;
        text-align:center;
        font-size:11px;
        color:#2d3a4a;
        letter-spacing:0.06em;
        z-index:10;
      }
    </style>
  </head>
